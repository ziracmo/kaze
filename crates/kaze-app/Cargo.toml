[package]
name = "kaze-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# Capitalised: macOS shows the executable name in the Dock and menu bar.
[[bin]]
name = "Kaze"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dirs = "7.0.0"
gpui-kit = "0.7.3"
kaze-core = { path = "../kaze-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3"

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }
tempfile = "3.27.0"
